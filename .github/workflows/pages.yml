name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:occt
      - run: npm run audit:licenses
      - run: bash -n scripts/package-occt-sources.sh
      - run: bash -n scripts/stage-occt-source-site.sh
      # Serve the candidate source archive from the SAME Pages deployment as
      # the WASM. Never publish an executable without the documented source.
      # Packaging is release-only to avoid downloading 68 MiB on each PR.
      - name: Stage matching OCCT candidate sources for Pages
        if: github.event_name != 'pull_request'
        run: bash scripts/stage-occt-source-site.sh
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist


  occt-replacement-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # This rewraps OCCT's WASM with a non-semantic custom section and tests
      # replacement loading + Boolean/STEP/STL + browser build output.
      # It is not an OCCT from-source rebuild or a legal compliance verdict.
      - run: node scripts/test-occt-replacement.mjs
      - run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - run: node scripts/test-occt-browser.mjs


  # Costly C++/WASM re-link: triggered only when a reviewer adds this label.
  # The pinned canary OCI digest may no longer be pullable (upstream retention);
  # document a registry failure rather than pretending a source rebuild passed.
  occt-source-rebuild:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'occt-source-rebuild')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash -n scripts/rebuild-occt-wrapper.sh
      - run: bash scripts/rebuild-occt-wrapper.sh
      - run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - run: node scripts/test-occt-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occt-source-wrapper-rebuild-evidence
          path: ${{ runner.temp }}/fabcad-occt-source-rebuild/replicad-wrapper-change.patch
          if-no-files-found: ignore
          retention-days: 14


  # Label-gated end-to-end source-to-site test. PR artifacts remain temporary;
  # on main the identical stage script embeds the candidate in the Pages site.
  occt-source-bundle:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'occt-source-bundle')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit:occt
      - run: bash scripts/stage-occt-source-site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: occt-lgpl-corresponding-source-candidate
          path: dist/lgpl/
          retention-days: 14
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
